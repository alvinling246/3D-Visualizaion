<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Data Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); overflow: hidden; }
        
        #login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 1000; }
        #login-container.hidden { display: none; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; }
        .login-box h1 { margin-bottom: 30px; color: #333; }
        #google-signin-btn { background: #4285f4; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        #google-signin-btn:hover { background: #357ae8; }
        
        #container { width: 100%; height: 100vh; }
        #menu { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 10px; display: none; }
        #menu.visible { display: block; }
        #menu button { background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 10px 20px; margin: 0 5px; cursor: pointer; border-radius: 5px; transition: all 0.3s; }
        #menu button:hover { background: rgba(255,255,255,0.4); }
        #menu button.active { background: white; color: #333; }
        
        .element { width: 120px; height: 160px; box-shadow: 0px 0px 12px rgba(0,255,255,0.5); border: 1px solid rgba(255,255,255,0.5); text-align: center; cursor: default; border-radius: 8px; overflow: hidden; }
        .element:hover { box-shadow: 0px 0px 20px rgba(0,255,255,0.8); }
        .element .photo { width: 60px; height: 60px; margin: 8px auto 5px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .element .name { font-weight: bold; color: white; font-size: 12px; margin: 3px 0; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .element .details { color: rgba(255,255,255,0.95); font-size: 10px; line-height: 1.3; padding: 0 5px; }
        
        .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; z-index: 999; display: none; }
        .loading.visible { display: block; }
        #user-info { position: absolute; top: 20px; right: 20px; color: white; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 5px; display: none; font-size: 14px; }
        #user-info.visible { display: block; }
        #logout-btn { background: #f44336; color: white; border: none; padding: 5px 15px; border-radius: 3px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>
    <div id="login-container">
        <div class="login-box">
            <h1>Sign In With Google</h1>
            <div id="google-signin-btn"></div>
            <p style="margin-top: 20px; color: #666; font-size: 14px;">Demo mode with sample data</p>
        </div>
    </div>

    <div class="loading">Loading data...</div>
    <div id="user-info"><span id="user-name"></span><button id="logout-btn">Logout</button></div>
    <div id="menu">
        <button id="table" class="active">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
    </div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/16.3.5/Tween.min.js"></script>
    <script>
        // CSS3DObject
        THREE.CSS3DObject = function(element) {
            THREE.Object3D.call(this);
            this.element = element;
            this.element.style.position = 'absolute';
            this.element.style.pointerEvents = 'auto';
        };
        THREE.CSS3DObject.prototype = Object.create(THREE.Object3D.prototype);
        THREE.CSS3DObject.prototype.constructor = THREE.CSS3DObject;

        // CSS3DRenderer
        THREE.CSS3DRenderer = function() {
            let _width, _height, _widthHalf, _heightHalf;
            const domElement = document.createElement('div');
            domElement.style.overflow = 'hidden';
            const cameraElement = document.createElement('div');
            cameraElement.style.transformStyle = 'preserve-3d';
            cameraElement.style.pointerEvents = 'none';
            domElement.appendChild(cameraElement);

            this.domElement = domElement;

            this.setSize = function(width, height) {
                _width = width;
                _height = height;
                _widthHalf = _width / 2;
                _heightHalf = _height / 2;
                domElement.style.width = width + 'px';
                domElement.style.height = height + 'px';
                cameraElement.style.width = width + 'px';
                cameraElement.style.height = height + 'px';
            };

            const epsilon = (value) => Math.abs(value) < 1e-10 ? 0 : value;

            const getCameraCSSMatrix = (matrix) => {
                const e = matrix.elements;
                return 'matrix3d(' +
                    epsilon(e[0]) + ',' + epsilon(-e[1]) + ',' + epsilon(e[2]) + ',' + epsilon(e[3]) + ',' +
                    epsilon(e[4]) + ',' + epsilon(-e[5]) + ',' + epsilon(e[6]) + ',' + epsilon(e[7]) + ',' +
                    epsilon(e[8]) + ',' + epsilon(-e[9]) + ',' + epsilon(e[10]) + ',' + epsilon(e[11]) + ',' +
                    epsilon(e[12]) + ',' + epsilon(-e[13]) + ',' + epsilon(e[14]) + ',' + epsilon(e[15]) + ')';
            };

            const getObjectCSSMatrix = (matrix) => {
                const e = matrix.elements;
                return 'translate(-50%,-50%) matrix3d(' +
                    epsilon(e[0]) + ',' + epsilon(e[1]) + ',' + epsilon(e[2]) + ',' + epsilon(e[3]) + ',' +
                    epsilon(-e[4]) + ',' + epsilon(-e[5]) + ',' + epsilon(-e[6]) + ',' + epsilon(-e[7]) + ',' +
                    epsilon(e[8]) + ',' + epsilon(e[9]) + ',' + epsilon(e[10]) + ',' + epsilon(e[11]) + ',' +
                    epsilon(e[12]) + ',' + epsilon(e[13]) + ',' + epsilon(e[14]) + ',' + epsilon(e[15]) + ')';
            };

            this.render = function(scene, camera) {
                const fov = 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * _height;
                domElement.style.perspective = fov + 'px';
                
                if (scene.autoUpdate) scene.updateMatrixWorld();
                if (!camera.parent) camera.updateMatrixWorld();

                const style = 'translateZ(' + fov + 'px)' + getCameraCSSMatrix(camera.matrixWorldInverse) +
                    ' translate(' + _widthHalf + 'px,' + _heightHalf + 'px)';
                cameraElement.style.transform = style;

                const renderObject = (obj) => {
                    if (obj instanceof THREE.CSS3DObject) {
                        obj.element.style.transform = getObjectCSSMatrix(obj.matrixWorld);
                        obj.element.style.display = obj.visible ? '' : 'none';
                        if (obj.element.parentNode !== cameraElement) {
                            cameraElement.appendChild(obj.element);
                        }
                    }
                    for (let i = 0; i < obj.children.length; i++) {
                        renderObject(obj.children[i]);
                    }
                };
                renderObject(scene);
            };
        };

        // TrackballControls (simplified)
        function TrackballControls(camera, domElement) {
            this.camera = camera;
            this.domElement = domElement;
            this.target = new THREE.Vector3();
            this.minDistance = 0;
            this.maxDistance = Infinity;
            
            let rotating = false, lastX = 0, lastY = 0;
            const scope = this;

            this.domElement.addEventListener('mousedown', (e) => {
                rotating = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });

            this.domElement.addEventListener('mousemove', (e) => {
                if (!rotating) return;
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                
                const offset = new THREE.Vector3().subVectors(camera.position, scope.target);
                const radius = offset.length();
                const theta = Math.atan2(offset.x, offset.z);
                const phi = Math.acos(offset.y / radius);
                
                camera.position.x = scope.target.x + radius * Math.sin(phi - dy * 0.01) * Math.sin(theta + dx * 0.01);
                camera.position.y = scope.target.y + radius * Math.cos(phi - dy * 0.01);
                camera.position.z = scope.target.z + radius * Math.sin(phi - dy * 0.01) * Math.cos(theta + dx * 0.01);
                camera.lookAt(scope.target);
                
                lastX = e.clientX;
                lastY = e.clientY;
            });

            this.domElement.addEventListener('mouseup', () => rotating = false);
            this.domElement.addEventListener('wheel', (e) => {
                const delta = e.deltaY;
                const offset = new THREE.Vector3().subVectors(camera.position, scope.target);
                const distance = offset.length() * (1 + delta * 0.001);
                const clampedDistance = Math.max(scope.minDistance, Math.min(scope.maxDistance, distance));
                offset.normalize().multiplyScalar(clampedDistance);
                camera.position.copy(scope.target).add(offset);
            });

            this.update = () => {
                camera.lookAt(scope.target);
            };
        }

        // ===== CONFIGURATION =====
        const CONFIG = {
            GOOGLE_CLIENT_ID: '1059398016252-a9rcejg3lt1obp95t31ocuu1im7ur11k.apps.googleusercontent.com',
            GOOGLE_SHEET_ID: '12hWWbZnZRrVOGKa7-eQ5F6jgAuI9j-4sPzIC-I_JsZw',
            SHEET_NAME: '3D Visualization Data',
            GOOGLE_API_KEY: 'AIzaSyA4eMBAPXUSBFJtK8h8VGxlETpoOSWOjlQ'
        };
        
        const USE_SAMPLE_DATA = true; // Using sample data due to CORS in Claude environment
        const TEST_MODE = false;

        let camera, scene, renderer, controls;
        let objects = [];
        let targets = { table: [], sphere: [], helix: [], grid: [] };

        // Sample data matching your actual sheet
        const sampleData = [
            {name: "Lee Siew Suan", photo: "https://static.kasatria.com/pivot-img/photo/019.jpg", age: "25", country: "CN", interest: "Writing", netWorth: "$251,260.80"},
            {name: "New Yee Chian", photo: "https://static.kasatria.com/pivot-img/photo/020.jpg", age: "23", country: "CN", interest: "Cooking", netWorth: "$60,393.60"},
            {name: "Wong Thiam Fook", photo: "https://static.kasatria.com/pivot-img/photo/021.jpg", age: "30", country: "CN", interest: "Traveling", netWorth: "$212,140.80"},
            {name: "Norsuzilawati Mohd Noor", photo: "https://static.kasatria.com/pivot-img/photo/022.jpg", age: "30", country: "MY", interest: "Painting", netWorth: "$208,228.80"},
            {name: "Norzainah Omar", photo: "https://static.kasatria.com/pivot-img/photo/023.jpg", age: "30", country: "MY", interest: "Hiking", netWorth: "$106,555.20"},
            {name: "Meghandran Nathy", photo: "https://static.kasatria.com/pivot-img/photo/024.jpg", age: "31", country: "IN", interest: "Cooking", netWorth: "$139,080.00"},
            {name: "Joyshree Goswami", photo: "https://static.kasatria.com/pivot-img/photo/025.jpg", age: "35", country: "IN", interest: "Painting", netWorth: "$192,278.40"},
            {name: "Geetha Maniam", photo: "https://static.kasatria.com/pivot-img/photo/026.jpg", age: "27", country: "IN", interest: "Cooking", netWorth: "$90,864.00"},
            {name: "Abdul Rahim Osman", photo: "https://static.kasatria.com/pivot-img/photo/027.jpg", age: "30", country: "MY", interest: "Cooking", netWorth: "$141,859.20"},
            {name: "Prem Anand Raj", photo: "https://static.kasatria.com/pivot-img/photo/028.jpg", age: "44", country: "IN", interest: "Gardening", netWorth: "$196,113.60"},
            {name: "Piara Singh Sarwan Singh", photo: "https://static.kasatria.com/pivot-img/photo/029.jpg", age: "34", country: "IN", interest: "Writing", netWorth: "$207,960.00"},
            {name: "Othman b Abdul Rahman", photo: "https://static.kasatria.com/pivot-img/photo/030.jpg", age: "53", country: "MY", interest: "Gardening", netWorth: "$193,200.00"},
            {name: "Sathiaseelan Paul Thurai", photo: "https://static.kasatria.com/pivot-img/photo/031.jpg", age: "59", country: "IN", interest: "Gardening", netWorth: "$264,456.00"},
            {name: "Abdul Farid Alias", photo: "https://static.kasatria.com/pivot-img/photo/MY0014.jpg", age: "36", country: "MY", interest: "Writing", netWorth: "$146,592.00"},
            {name: "Abu Hassan Assari Ibrahim", photo: "https://static.kasatria.com/pivot-img/photo/MY0010.jpg", age: "43", country: "MY", interest: "Gardening", netWorth: "$213,657.60"},
            ...Array.from({length: 185}, (_, i) => ({
                name: `Person ${i + 16}`,
                photo: `https://i.pravatar.cc/80?img=${(i % 70) + 1}`,
                age: 20 + (i % 50),
                country: ['USA', 'UK', 'Canada', 'Australia', 'Germany', 'MY', 'CN', 'IN'][i % 8],
                interest: ['Tech', 'Sports', 'Music', 'Art', 'Travel', 'Writing', 'Cooking', 'Hiking', 'Painting', 'Gardening'][i % 10],
                netWorth: `${50000 + (i * 2000)}`
            }))
        ];

        // Initialize
        if (USE_SAMPLE_DATA) {
            setTimeout(() => {
                document.getElementById('login-container').classList.add('hidden');
                document.querySelector('.loading').classList.add('visible');
                document.getElementById('user-name').textContent = 'Demo User';
                document.getElementById('user-info').classList.add('visible');
                setTimeout(() => {
                    document.querySelector('.loading').classList.remove('visible');
                    initVisualization(sampleData);
                }, 1000);
            }, 500);
        } else if (TEST_MODE) {
            // Skip OAuth and load directly from Google Sheets
            setTimeout(() => {
                document.getElementById('login-container').classList.add('hidden');
                document.querySelector('.loading').classList.add('visible');
                document.getElementById('user-name').textContent = 'Test User';
                document.getElementById('user-info').classList.add('visible');
                loadGoogleSheetsData();
            }, 500);
        } else {
            // Load Google Sign-In
            window.onload = function() {
                const script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.onload = initGoogleSignIn;
                document.head.appendChild(script);
            };
        }

        function initGoogleSignIn() {
            google.accounts.id.initialize({
                client_id: CONFIG.GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
            
            google.accounts.id.renderButton(
                document.getElementById('google-signin-btn'),
                { theme: 'filled_blue', size: 'large', text: 'signin_with' }
            );
        }

        function handleCredentialResponse(response) {
            document.getElementById('login-container').classList.add('hidden');
            document.querySelector('.loading').classList.add('visible');
            
            // Decode JWT to get user info
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                document.getElementById('user-name').textContent = payload.name || payload.email;
                document.getElementById('user-info').classList.add('visible');
            } catch(e) {
                document.getElementById('user-name').textContent = 'User';
                document.getElementById('user-info').classList.add('visible');
            }
            
            loadGoogleSheetsData();
        }

        async function loadGoogleSheetsData() {
            try {
                // Try using the public CSV export URL instead
                const csvUrl = `https://docs.google.com/spreadsheets/d/${CONFIG.GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
                
                console.log('Fetching from:', csvUrl);
                const res = await fetch(csvUrl);
                
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                
                const csvText = await res.text();
                console.log('CSV data received, length:', csvText.length);
                
                // Parse CSV
                const lines = csvText.split('\n');
                const data = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    // Simple CSV parsing (handles quoted values)
                    const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                    const cleanValues = values.map(v => v.replace(/^"|"$/g, '').trim());
                    
                    if (cleanValues.length >= 6) {
                        data.push({
                            name: cleanValues[0] || '',
                            photo: cleanValues[1] || 'https://via.placeholder.com/80',
                            age: cleanValues[2] || '',
                            country: cleanValues[3] || '',
                            interest: cleanValues[4] || '',
                            netWorth: cleanValues[5] || ''
                        });
                    }
                }
                
                console.log('Parsed data rows:', data.length);
                
                if (data.length === 0) {
                    throw new Error('No data found in sheet');
                }
                
                document.querySelector('.loading').classList.remove('visible');
                initVisualization(data);
            } catch (e) {
                console.error('Error loading data:', e);
                document.querySelector('.loading').innerHTML = `
                    <div style="background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; max-width: 500px;">
                        <h3 style="color: #ff6b6b; margin-bottom: 10px;">⚠️ Unable to Load Data</h3>
                        <p style="color: white; margin-bottom: 10px;">Error: ${e.message}</p>
                        <p style="color: #aaa; font-size: 12px;">This might be due to:</p>
                        <ul style="color: #aaa; font-size: 12px; text-align: left; margin: 10px 0;">
                            <li>CORS restrictions in Claude's environment</li>
                            <li>Sheet permissions not set to public</li>
                            <li>API key not properly configured</li>
                        </ul>
                        <button onclick="location.reload()" style="background: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px;">
                            Retry
                        </button>
                        <button onclick="useSampleData()" style="background: #34a853; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; margin-left: 10px;">
                            Use Sample Data
                        </button>
                    </div>
                `;
            }
        }
        
        // Fallback to sample data
        window.useSampleData = function() {
            document.querySelector('.loading').classList.remove('visible');
            initVisualization(sampleData);
        };

        function getColorByNetWorth(netWorthStr) {
            const val = parseFloat(netWorthStr.replace(/[^0-9.]/g, '')) * 1000;
            if (val < 100000) return 'rgba(244, 67, 54, 0.85)';
            if (val < 200000) return 'rgba(255, 152, 0, 0.85)';
            return 'rgba(76, 175, 80, 0.85)';
        }

        function initVisualization(data) {
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 3000;
            scene = new THREE.Scene();

            // Create elements
            data.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'element';
                el.style.backgroundColor = getColorByNetWorth(item.netWorth);
                el.innerHTML = `
                    <img class="photo" src="${item.photo}" onerror="this.src='https://via.placeholder.com/60'">
                    <div class="name">${item.name}</div>
                    <div class="details">Age: ${item.age}<br>${item.country}<br>${item.interest}<br>${item.netWorth}</div>
                `;
                const obj = new THREE.CSS3DObject(el);
                obj.position.set(Math.random() * 4000 - 2000, Math.random() * 4000 - 2000, Math.random() * 4000 - 2000);
                scene.add(obj);
                objects.push(obj);
            });

            // TABLE layout - 20x10
            objects.forEach((_, i) => {
                const obj = new THREE.Object3D();
                obj.position.x = (i % 20) * 140 - 1330;
                obj.position.y = -(Math.floor(i / 20)) * 180 + 900;
                targets.table.push(obj);
            });

            // SPHERE layout
            objects.forEach((_, i) => {
                const phi = Math.acos(-1 + (2 * i) / objects.length);
                const theta = Math.sqrt(objects.length * Math.PI) * phi;
                const obj = new THREE.Object3D();
                obj.position.setFromSphericalCoords(800, phi, theta);
                obj.lookAt(new THREE.Vector3().copy(obj.position).multiplyScalar(2));
                targets.sphere.push(obj);
            });

            // DOUBLE HELIX layout
            objects.forEach((_, i) => {
                const obj = new THREE.Object3D();
                const theta = i * 0.175 + Math.PI;
                const y = -(i * 8) + 800;
                const radius = 450;
                const phase = (i % 2) * Math.PI;
                obj.position.setFromCylindricalCoords(radius, theta + phase, y);
                obj.lookAt(new THREE.Vector3(obj.position.x * 2, obj.position.y, obj.position.z * 2));
                targets.helix.push(obj);
            });

            // GRID layout - 5x4x10
            objects.forEach((_, i) => {
                const obj = new THREE.Object3D();
                obj.position.x = (i % 5) * 200 - 400;
                obj.position.y = -(Math.floor((i / 5) % 4)) * 200 + 300;
                obj.position.z = -Math.floor(i / 20) * 400 + 1800;
                targets.grid.push(obj);
            });

            // Renderer
            renderer = new THREE.CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Controls
            controls = new TrackballControls(camera, renderer.domElement);
            controls.minDistance = 500;
            controls.maxDistance = 6000;

            // Menu
            document.getElementById('menu').classList.add('visible');
            ['table', 'sphere', 'helix', 'grid'].forEach(id => {
                document.getElementById(id).onclick = (e) => {
                    transform(targets[id], 2000);
                    document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                };
            });

            transform(targets.table, 2000);
            window.addEventListener('resize', onResize);
            animate();
        }

        function transform(targetObjs, duration) {
            TWEEN.removeAll();
            objects.forEach((obj, i) => {
                const tgt = targetObjs[i];
                new TWEEN.Tween(obj.position).to(tgt.position, Math.random() * duration + duration).easing(TWEEN.Easing.Exponential.InOut).start();
                new TWEEN.Tween(obj.rotation).to(tgt.rotation, Math.random() * duration + duration).easing(TWEEN.Easing.Exponential.InOut).start();
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            renderer.render(scene, camera);
        }

        document.getElementById('logout-btn').onclick = () => location.reload();
    </script>
</body>
</html>
